# Databricks Asset Bundle — gaim-executive-app
#
# The weekly ARR forecasting job (UCC + ITSG -> unify/publish -> Power BI export)
# is managed in the Databricks Jobs UI; its four notebooks live in notebooks/ and
# the task order is documented in notebooks/README.md. No jobs are defined here,
# so `databricks bundle deploy` will not recreate any retired job.

bundle:
  name: gaim-executive-app

workspace:
  host: https://goto-data-dock.cloud.databricks.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

  prod:
    mode: production
    workspace:
      root_path: /Users/gaim-team/.bundle/${bundle.name}/prod
